<h1 id="01-%E5%B0%8E%E5%85%A5%E3%83%BB%E6%9C%AC%E6%96%87">01. 導入・本文</h1>
<h2 id="%E8%A6%81%E9%BB%9E%E3%82%92%E4%BC%9D%E3%81%88%E8%A9%B1%E3%81%97%E6%89%8B%E3%82%92%E7%B4%B9%E4%BB%8B%E3%81%99%E3%82%8B">要點を伝え、話し手を紹介する</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E5%9F%BA%E6%9C%AC%E3%81%AE%E6%9C%AC%E6%96%87">基本の本文</h1>
<h2 id="1%E6%9E%9A%E3%81%AB%E3%81%A4%E3%81%8D%E4%BC%9D%E3%81%88%E3%81%9F%E3%81%84%E3%81%93%E3%81%A8%E3%81%AF1%E3%81%A4">1枚につき、伝えたいことは1つ</h2>
<p>見出しで結論を示し、本文で背景を補います。</p>
<ul>
<li>箇條書きは3〜5項目を目安にする</li>
<li><strong>重要な言葉</strong>だけを強調する</li>
<li>詳しい情報は別のスライドに分ける</li>
</ul>
<blockquote>
<p>補足や注意點は引用記法で添えられます。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="lead" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="lead" data-marpit-pagination="5" style="--paginate:true;--class:lead;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E3%82%AD%E3%83%BC%E3%83%A1%E3%83%83%E3%82%BB%E3%83%BC%E3%82%B8">キーメッセージ</h1>
<h2 id="%E4%BC%9D%E3%82%8F%E3%82%8B%E8%B3%87%E6%96%99%E3%81%AF%E9%81%B8%E3%81%B3%E3%82%84%E3%81%99%E3%81%84">伝わる資料は、選びやすい。</h2>
<p>情報の役割に合ったレイアウトを選ぶことで、読み手の理解を助けます。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="quote" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="quote" data-marpit-pagination="6" style="--paginate:true;--class:quote;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E5%BC%95%E7%94%A8%E3%83%BB%E5%8F%83%E5%8A%A0%E8%80%85%E3%81%AE%E8%81%B2">引用・參加者の聲</h1>
<blockquote>
<p>必要な情報をすぐに見つけられると、<br />
次の行動に迷わなくなります。</p>
</blockquote>
<p>ユーザーインタビューより（架空のコメント）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="profile avatar-circle" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="profile avatar-circle" data-marpit-pagination="7" style="--paginate:true;--class:profile avatar-circle;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E3%83%97%E3%83%AD%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E5%8F%B3%E3%81%AB%E4%B8%B8%E5%BD%A2%E3%81%AE%E5%AF%AB%E7%9C%9F">プロフィール：右に丸形の寫真</h1>
<p><img src="https://ymho.github.io/aizome/assets/profile-placeholder.svg" alt="avatar" /></p>
<h2 id="%E6%B0%B4%E5%9F%8E%E3%82%A2%E3%82%AA">水城アオ</h2>
<p><strong>プロダクトエンジニア</strong> ｜ 東京（サンプル）</p>
<p>使う人の課題を整理し、伝わる畫面と動く仕組みをつくります。<br />
設計から実裝、使い始めたあとの改善まで擔當しています。</p>
<ul>
<li>
<p><strong>これまで</strong></p>
<p>Web製作から業務システム開発、プロダクト改善へ。</p>
</li>
<li>
<p><strong>得意なこと</strong></p>
<p>UI設計・フロントエンド開発・情報の可視化。</p>
</li>
<li>
<p><strong>関心と好きなこと</strong></p>
<p>チームの知識共有。休日は街歩きと寫真、コーヒー。</p>
</li>
</ul>
<blockquote>
<p>小さくつくり、使いながら磨く。</p>
</blockquote>

<h1 id="%E3%82%88%E3%81%8F%E3%81%82%E3%82%8B%E8%B3%AA%E5%95%8F">よくある質問</h1>
<h2 id="html%E3%81%AF%E5%BF%85%E8%A6%81%E3%81%A7%E3%81%99%E3%81%8B">HTMLは必要ですか？</h2>
<p>不要です。通常のMarkdownとMarpのディレクティブで記述します。</p>
<h2 id="%E3%82%AB%E3%83%BC%E3%83%89%E3%81%AE%E4%B8%AD%E3%81%AB%E7%AE%87%E6%A2%9D%E6%9B%B8%E3%81%8D%E3%82%92%E7%BD%AE%E3%81%91%E3%81%BE%E3%81%99%E3%81%8B">カードの中に箇條書きを置けますか？</h2>
<p>はい。カードを表すリストの中に、インデントしてリストを書きます。</p>
<h2 id="%E6%96%87%E7%AB%A0%E3%81%8C%E5%85%A5%E3%82%8A%E3%81%8D%E3%82%89%E3%81%AA%E3%81%84%E3%81%A8%E3%81%8D%E3%81%AF">文章が入りきらないときは？</h2>
<p>內容を分割し、必要に応じて <code>dense</code> クラスを使います。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="section" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="section" data-marpit-pagination="9" style="--paginate:true;--class:section;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="02-%E3%82%AB%E3%83%BC%E3%83%89%E3%83%BB%E6%AF%94%E8%BC%83%E3%83%BB%E6%95%B8%E5%80%A4">02. カード・比較・數値</h1>
<h2 id="%E6%83%85%E5%A0%B1%E3%82%92%E4%B8%A6%E3%81%B9%E9%81%95%E3%81%84%E3%81%A8%E5%A4%A7%E3%81%8D%E3%81%95%E3%82%92%E8%A6%8B%E3%81%9B%E3%82%8B">情報を並べ、違いと大きさを見せる</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="cards card-top" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="cards card-top" data-marpit-pagination="10" style="--paginate:true;--class:cards card-top;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E3%82%AB%E3%83%BC%E3%83%89%E9%A0%85%E7%9B%AE%E6%95%B8%E3%81%AB%E5%90%88%E3%82%8F%E3%81%9B%E3%81%A6%E4%B8%A6%E3%81%B9%E3%82%8B">カード：項目數に合わせて並べる</h1>
<ul>
<li>
<p><strong>見つける</strong></p>
<p>必要な情報へたどり著く。</p>
</li>
<li>
<p><strong>理解する</strong></p>
<p>要點と根拠を確認する。</p>
</li>
<li>
<p><strong>動く</strong></p>
<p>次の行動を選ぶ。</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="code code-dark" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="code code-dark" data-marpit-pagination="35" style="--paginate:true;--class:code code-dark;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E3%82%B3%E3%83%BC%E3%83%89%E3%82%92%E5%A4%A7%E3%81%8D%E3%81%8F%E8%A6%8B%E3%81%9B%E3%82%8B">コードを大きく見せる</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">average</span>(<span class="hljs-params">values</span>):
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> values:
        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;values must not be empty&quot;</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">sum</span>(values) / <span class="hljs-built_in">len</span>(values)


result = average([<span class="hljs-number">12</span>, <span class="hljs-number">18</span>, <span class="hljs-number">24</span>])
<span class="hljs-built_in">print</span>(result)  <span class="hljs-comment"># 18.0</span>
</code></pre>
<p><code>code-dark</code> でコード欄を黒背景に。言語名はコード欄の左上に表示します。</p>

<li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">normalize</span>(<span class="hljs-params">text</span>):
    <span class="hljs-keyword">return</span> text.strip().lower()

<span class="hljs-built_in">print</span>(normalize(<span class="hljs-string">&quot; Aizome &quot;</span>))
</code></pre>
</li>

<ul>
<li>
<p><strong>藍</strong></p>

<p><em><strong>蛍光ペン風</strong></em>の強調</p>
</li>
<li>
<p><strong>青鈍</strong></p>

</li>
<li>

<p><em><strong>蛍光ペン風</strong></em>の強調</p>
</li>
</ul>
<p>配色は <code>palette-ai</code> などを追加。蛍光ペン風の強調は <code>***重要な言葉***</code>。</p>

<header>06 / 配色・余白・見出し</header>

<h1 id="%E5%B0%8F%E3%81%95%E3%81%AA%E3%82%BB%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%B3%E5%90%8D%E3%82%92%E6%B7%BB%E3%81%88%E9%95%B7%E3%81%84%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB%E3%82%82%E6%96%87%E5%AD%97%E3%82%92%E7%B8%AE%E3%82%81%E3%81%9A%E3%81%AB%E6%9C%AC%E6%96%87%E3%81%A8%E4%BD%99%E7%99%BD%E3%82%92%E5%88%86%E3%81%91%E3%81%A6%E4%BC%9D%E3%81%88%E3%82%8B">小さなセクション名を添え、長いタイトルも文字を縮めずに本文と余白を分けて伝える</h1>
<ul>
<li>
<p><strong>見出しの役割</strong></p>
<p>セクション名で資料內の位置を示し、タイトルでこの1枚の結論を伝えます。</p>
<p><code>no-title</code> を追加すると、見出しとその領域を取り除きます。</p>
</li>
<li>
<p><strong>好きな位置に余白を足す</strong></p>
<p><code>![vspace-md](https://ymho.github.io/aizome/assets/spacer.svg)</code></p>
<p><img src="https://ymho.github.io/aizome/assets/spacer.svg" alt="vspace-md" /></p>
<p>この上に24px追加。前後に空行を置き、カード內ではインデントします。</p>
</li>
</ul>
<p><code>vspace-xs / sm / md / lg / xl / 2xl</code>：8 / 16 / 24 / 32 / 48 / 64px。通常の段落間隔に加算します。</p>
<p><code>title-long section-title</code>：タイトルは34px・2行まで。短いタイトルでは <code>title-long</code> を外せます。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="section" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="section" data-marpit-pagination="42" style="--paginate:true;--class:section;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="07-%E3%83%93%E3%82%B8%E3%83%8D%E3%82%B9%E8%A8%AD%E8%A8%88">07. ビジネス設計</h1>
<h2 id="%E9%A1%A7%E5%AE%A2%E7%90%86%E8%A7%A3%E3%81%8B%E3%82%89%E4%BA%8B%E6%A5%AD%E3%81%AE%E4%BB%AE%E8%AA%AC%E3%81%A8%E6%96%BD%E7%AD%96%E3%81%B8">顧客理解から、事業の仮説と施策へ</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="journey" data-theme="d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q" lang="C" class="journey" data-marpit-pagination="43" style="--paginate:true;--class:journey;--theme:d26e14f49e8v2zgqgk1f8grfqo9eh5emgp3wrltg0o9q;" data-marpit-pagination-total="55">
<h1 id="%E3%82%AB%E3%82%B9%E3%82%BF%E3%83%9E%E3%83%BC%E3%82%B8%E3%83%A3%E3%83%BC%E3%83%8B%E3%83%BC%E3%83%9E%E3%83%83%E3%83%97">カスタマージャーニーマップ</h1>
<p>対象：初めて導入する店舗オーナー ／ 目的：予約受付を開始する（架空の仮説）</p>
<table>
<thead>
<tr>
<th>観點</th>
<th>認知</th>
<th>比較</th>
<th>申込</th>
<th>初回利用</th>
<th>継続</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>行動</strong></td>
<td>紹介記事を読む</td>
<td>料金を調べる</td>
<td>店舗を登錄</td>
<td>予約枠を公開</td>
